{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">

        <h2 class="mb-4">Edit Task</h2>

        <form method="POST">

            {% csrf_token %}

            <!-- Title -->

            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input 
                    type="text"
                    name="title"
                    value="{{ task.title }}"
                    class="form-control"
                    required
                >

            </div>

            <!-- Description -->

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea 
                    name="description"
                    class="form-control"
                    rows="3"
                >{{ task.description }}</textarea>

            </div>

            <!-- Due Date -->

            <div class="mb-3">

                <label class="form-label">
                    Due Date
                </label>

                <input 
                    type="date"
                    name="due_date"
                    value="{{ task.due_date|date:'Y-m-d' }}"
                    class="form-control"
                >

            </div>

            <!-- Priority -->

            <div class="mb-3">

                <label class="form-label">
                    Priority
                </label>

                <select name="priority" class="form-select">

                    <option value="Low"
                        {% if task.priority == 'Low' %}
                            selected
                        {% endif %}
                    >
                        Low
                    </option>

                    <option value="Medium"
                        {% if task.priority == 'Medium' %}
                            selected
                        {% endif %}
                    >
                        Medium
                    </option>

                    <option value="High"
                        {% if task.priority == 'High' %}
                            selected
                        {% endif %}
                    >
                        High
                    </option>

                </select>

            </div>

            <!-- Completed -->

            <div class="form-check mb-4">

                <input 
                    type="checkbox"
                    name="completed"
                    class="form-check-input"
                    id="completed"

                    {% if task.completed %}
                        checked
                    {% endif %}
                >

                <label class="form-check-label" for="completed">
                    Completed
                </label>

            </div>

            <!-- Buttons -->

            <button type="submit" class="btn btn-primary">
                Update Task
            </button>

            <a href="/" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
